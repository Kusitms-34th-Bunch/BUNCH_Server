server:
  port: ${SERVER_PORT:8080}
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
spring:
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 31MB
  application:
    name: bunch
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bunch}
    username: ${DB_USERNAME:bunch}
    password: ${DB_PASSWORD:bunch_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
profanity:
  dictionary-path: ${PROFANITY_DICTIONARY_PATH:}
jwt:
  secret: ${JWT_SECRET}
auth:
  apple:
    client-id: ${APPLE_CLIENT_ID}
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}
    token-uri: ${APPLE_TOKEN_URI:https://appleid.apple.com/auth/token}
    revoke-uri: ${APPLE_REVOKE_URI:https://appleid.apple.com/auth/revoke}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  kakao:
    client-id: ${KAKAO_NATIVE_APP_KEY}
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [traceId=%X{traceId}] [eventId=%X{eventId}] [userId=%X{userId}] %-5level %logger{36} - %msg%n"

terms:
  service-version: ${TERMS_SERVICE_VERSION:}
  privacy-version: ${TERMS_PRIVACY_VERSION:}
  age-version: ${TERMS_AGE_VERSION:}
  demographics-version: ${TERMS_DEMOGRAPHICS_VERSION:}
r2:
  endpoint: ${R2_ENDPOINT:}
  bucket: ${R2_BUCKET:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
# The new recommended bundles (docs/specs/reco-bundle-combination.md). Off by default: while it is off nothing is put in
# the queue and nothing is calculated or kept, because the recommended bundles that are shown are still the old ones.
reco:
  combination:
    enabled: ${RECO_COMBINATION_ENABLED:false}
bunch:
  bundle:
    stage-thresholds: ${BUNCH_BUNDLE_STAGE_THRESHOLDS:0,2,6,10}
  invitation-base-url: ${BUNCH_INVITATION_BASE_URL:http://localhost:3000/invite}
  websocket:
    allowed-origins: ${BUNCH_WS_ALLOWED_ORIGINS:http://localhost:3000}
async-job:
  worker:
    enabled: true
    poll-interval-ms: 2000
    batch-size: 10
    lease-seconds: 300
  retry:
    max-attempts: 5
    base-seconds: 10
notification:
  push:
    device-encryption-key: ${PUSH_DEVICE_ENCRYPTION_KEY:}
    apns:
      team-id: ${APNS_TEAM_ID:}
      key-id: ${APNS_KEY_ID:}
      private-key: ${APNS_PRIVATE_KEY:}
      sandbox-topic: ${APNS_SANDBOX_TOPIC:}
      production-topic: ${APNS_PRODUCTION_TOPIC:}
