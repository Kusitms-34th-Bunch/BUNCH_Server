server:
  port: ${SERVER_PORT:8080}
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
spring:
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 31MB
  application:
    name: bunch
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bunch}
    username: ${DB_USERNAME:bunch}
    password: ${DB_PASSWORD:bunch_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
jwt:
  secret: ${JWT_SECRET}
auth:
  apple:
    client-id: ${APPLE_CLIENT_ID}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  kakao:
    client-id: ${KAKAO_NATIVE_APP_KEY}
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [traceId=%X{traceId}] [eventId=%X{eventId}] [userId=%X{userId}] %-5level %logger{36} - %msg%n"

terms:
  service-version: ${TERMS_SERVICE_VERSION:}
  privacy-version: ${TERMS_PRIVACY_VERSION:}
  age-version: ${TERMS_AGE_VERSION:}
  demographics-version: ${TERMS_DEMOGRAPHICS_VERSION:}
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
bunch:
  invitation-base-url: ${BUNCH_INVITATION_BASE_URL:http://localhost:3000/invite}
  websocket:
    allowed-origins: ${BUNCH_WS_ALLOWED_ORIGINS:http://localhost:3000}
async-job:
  worker:
    enabled: true
    poll-interval-ms: 2000
    batch-size: 10
    lease-seconds: 300
  retry:
    max-attempts: 5
    base-seconds: 10
