name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]

permissions:
  contents: read
  packages: write

concurrency:
  group: bunch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app: ${{ steps.paths.outputs.app }}
      monitoring: ${{ steps.paths.outputs.monitoring }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check build and deployment changes
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          app=false
          monitoring=false
          if [[ "$BASE" =~ ^0+$ ]]; then
            app=true
            monitoring=true
          else
            if [[ "$EVENT_NAME" == 'pull_request' ]]; then
              BASE=$(git merge-base "$BASE" "$HEAD")
            fi
            changed=$(mktemp)
            trap 'rm -f "$changed"' EXIT
            git diff --no-renames --name-only -z "$BASE" "$HEAD" > "$changed"
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/workflows/ci.yml|deploy/compose.yaml|deploy/.env.example)
                  app=true
                  monitoring=true
                  ;;
                src/*|scripts/r2/*|gradle/*|gradlew|gradlew.bat|build.gradle.kts|settings.gradle.kts|gradle.properties|Dockerfile|.dockerignore)
                  app=true
                  ;;
                deploy/monitoring/*)
                  monitoring=true
                  ;;
              esac
            done < "$changed"
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "monitoring=$monitoring" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app != 'false' || needs.changes.outputs.monitoring != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bunch_test
          POSTGRES_USER: bunch
          POSTGRES_PASSWORD: bunch_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bunch -d bunch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:postgresql://localhost:5432/bunch_test
      DB_USERNAME: bunch
      DB_PASSWORD: bunch_local
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build
      - name: Test the R2 migration tool
        if: needs.changes.outputs.app == 'true'
        run: |
          if [[ -f scripts/r2/run.sh ]]; then
            bash scripts/r2/run.sh test
          fi
      - name: Validate monitoring configuration
        if: needs.changes.result != 'success' || needs.changes.outputs.monitoring != 'false'
        run: |
          cp deploy/.env.example deploy/.env
          bash deploy/monitoring/check.sh
      - name: Test Grafana and Loki with local HTTP stubs
        if: needs.changes.result != 'success' || needs.changes.outputs.monitoring != 'false'
        run: python3 deploy/monitoring/smoke_test.py
      - name: Log in to GHCR
        if: github.event_name == 'push' && needs.changes.result == 'success' && needs.changes.outputs.app == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        if: github.event_name == 'push' && needs.changes.result == 'success' && needs.changes.outputs.app == 'true'
        env:
          IMAGE: ghcr.io/kusitms-34th-bunch/bunch_server
        run: |
          set -euo pipefail
          image="$IMAGE:$GITHUB_REF_NAME-$GITHUB_SHA"
          docker build -t "$image" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" .
          digest=$(docker push --quiet "$image")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Published image: `%s@%s`\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
