name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]

permissions:
  contents: read
  packages: write

concurrency:
  group: bunch-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app: ${{ steps.paths.outputs.app }}
      monitoring: ${{ steps.paths.outputs.monitoring }}
      deploy_app: ${{ steps.paths.outputs.deploy_app }}
      deploy_monitoring: ${{ steps.paths.outputs.deploy_monitoring }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check build and deployment changes
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          # This job has no environment: vars here are repository configuration variables.
          REPO_DEPLOY_DEV_ENABLED: ${{ vars.DEPLOY_DEV_ENABLED }}
          REPO_DEPLOY_PROD_ENABLED: ${{ vars.DEPLOY_PROD_ENABLED }}
          REPO_MONITORING_DEPLOY_ENABLED: ${{ vars.MONITORING_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          app=false
          monitoring=false
          if [[ "$BASE" =~ ^0+$ ]]; then
            app=true
            monitoring=true
          else
            if [[ "$EVENT_NAME" == 'pull_request' ]]; then
              BASE=$(git merge-base "$BASE" "$HEAD")
            fi
            changed=$(mktemp)
            trap 'rm -f "$changed"' EXIT
            git diff --no-renames --name-only -z "$BASE" "$HEAD" > "$changed"
            while IFS= read -r -d '' path; do
              case "$path" in
                *.md) ;;
                .github/workflows/ci.yml|deploy/compose.yaml|deploy/.env.example|deploy/environments/*|deploy/*.sh|deploy/*.py|deploy/tests/*)
                  app=true
                  monitoring=true
                  ;;
                src/*|scripts/r2/*|gradle/*|gradlew|gradlew.bat|build.gradle.kts|settings.gradle.kts|gradle.properties|Dockerfile|.dockerignore)
                  app=true
                  ;;
                deploy/monitoring/*)
                  monitoring=true
                  ;;
              esac
            done < "$changed"
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "monitoring=$monitoring" >> "$GITHUB_OUTPUT"
          deploy_app=false
          deploy_monitoring=false
          if [[ "$EVENT_NAME" == 'push' ]]; then
            if [[ "$app" == 'true' ]] &&
               { [[ "$REF" == 'refs/heads/dev' && "$REPO_DEPLOY_DEV_ENABLED" == 'true' ]] ||
                 [[ "$REF" == 'refs/heads/main' && "$REPO_DEPLOY_PROD_ENABLED" == 'true' ]]; }; then
              deploy_app=true
            fi
            if [[ "$REF" == 'refs/heads/main' && "$monitoring" == 'true' &&
                  "$REPO_MONITORING_DEPLOY_ENABLED" == 'true' ]]; then
              deploy_monitoring=true
            fi
          fi
          echo "deploy_app=$deploy_app" >> "$GITHUB_OUTPUT"
          echo "deploy_monitoring=$deploy_monitoring" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app != 'false' || needs.changes.outputs.monitoring != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bunch_test
          POSTGRES_USER: bunch
          POSTGRES_PASSWORD: bunch_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bunch -d bunch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:postgresql://localhost:5432/bunch_test
      DB_USERNAME: bunch
      DB_PASSWORD: bunch_local
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build
      - name: Test R2 migration tool when present
        run: |
          if [[ -f scripts/r2/run.sh ]]; then
            bash scripts/r2/run.sh test
          fi
      - name: Validate monitoring configuration
        if: needs.changes.result != 'success' || needs.changes.outputs.monitoring != 'false'
        run: |
          bash deploy/monitoring/check.sh
      - name: Test Grafana and Loki with local HTTP stubs
        if: needs.changes.result != 'success' || needs.changes.outputs.monitoring != 'false'
        run: python3 deploy/monitoring/smoke_test.py
      - name: Validate deployment contracts and release safety
        run: bash deploy/check.sh
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore

  publish:
    needs: [changes, build]
    if: github.event_name == 'push' && needs.build.result == 'success' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      environment: ${{ steps.image.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Package verified source
        run: ./gradlew bootJar
      - name: Select immutable image tag
        id: image
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            dev) environment=dev ;;
            main) environment=prod ;;
            *) exit 1 ;;
          esac
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image tag
        env:
          ENVIRONMENT: ${{ steps.image.outputs.environment }}
        run: |
          set -euo pipefail
          image="ghcr.io/kusitms-34th-bunch/bunch_server:$ENVIRONMENT-$GITHUB_SHA"
          docker build -t "$image" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" .
          docker push "$image"

  deploy:
    needs: [changes, build, publish]
    # Enable flags are captured in changes (no environment), so environment-scoped
    # variables cannot override the repository's deployment admission decision.
    # One server job per run avoids sibling jobs replacing each other while pending.
    if: >-
      always() && !cancelled() && github.event_name == 'push' &&
      needs.changes.result == 'success' && needs.build.result == 'success' &&
      ((needs.publish.result == 'success' && needs.changes.outputs.deploy_app == 'true') ||
       (needs.changes.outputs.deploy_monitoring == 'true' &&
        (needs.publish.result == 'success' || needs.publish.result == 'skipped')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'prod' }}
    concurrency:
      group: bunch-server-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH transport
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sshpass
          install -m 700 -d ~/.ssh
      # Reuse the frozen repository decision after environment secrets become available.
      - name: Deploy approved application and shared monitoring sequentially
        env:
          DEPLOY_ENV: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'prod' }}
          DEPLOY_APP: ${{ needs.publish.result == 'success' && needs.changes.outputs.deploy_app == 'true' }}
          DEPLOY_MONITORING: ${{ needs.changes.outputs.deploy_monitoring }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_APP" == 'true' ]]; then
            bash deploy/ci-deploy.sh "$DEPLOY_ENV" "$GITHUB_SHA"
          fi
          if [[ "$DEPLOY_MONITORING" == 'true' ]]; then
            bash deploy/ci-deploy.sh monitoring "$GITHUB_SHA"
          fi
