name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]

permissions:
  contents: read
  packages: write

concurrency:
  group: bunch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app: ${{ steps.paths.outputs.app }}
      monitoring: ${{ steps.paths.outputs.monitoring }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check build and deployment changes
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          app=false
          monitoring=false
          if [[ "$BASE" =~ ^0+$ ]]; then
            app=true
            monitoring=true
          else
            if [[ "$EVENT_NAME" == 'pull_request' ]]; then
              BASE=$(git merge-base "$BASE" "$HEAD")
            fi
            changed=$(mktemp)
            trap 'rm -f "$changed"' EXIT
            git diff --no-renames --name-only -z "$BASE" "$HEAD" > "$changed"
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/workflows/ci.yml|deploy/compose.yaml|deploy/.env.example)
                  app=true
                  monitoring=true
                  ;;
                src/*|gradle/*|gradlew|gradlew.bat|build.gradle.kts|settings.gradle.kts|gradle.properties|Dockerfile|.dockerignore)
                  app=true
                  ;;
                deploy/monitoring/*)
                  monitoring=true
                  ;;
              esac
            done < "$changed"
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "monitoring=$monitoring" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app != 'false' || needs.changes.outputs.monitoring != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bunch_test
          POSTGRES_USER: bunch
          POSTGRES_PASSWORD: bunch_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bunch -d bunch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:postgresql://localhost:5432/bunch_test
      DB_USERNAME: bunch
      DB_PASSWORD: bunch_local
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build
      - name: Validate monitoring configuration
        if: needs.changes.result != 'success' || needs.changes.outputs.monitoring != 'false'
        run: |
          cp deploy/.env.example deploy/.env
          bash deploy/monitoring/check.sh
      - name: Test Grafana and Loki with local HTTP stubs
        if: needs.changes.result != 'success' || needs.changes.outputs.monitoring != 'false'
        run: python3 deploy/monitoring/smoke_test.py
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.result == 'success' && needs.changes.outputs.app == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.result == 'success' && needs.changes.outputs.app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/kusitms-34th-bunch/bunch_server:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Pull published image on server
        if: steps.publish.outputs.digest != ''
        env:
          APP_IMAGE: ghcr.io/kusitms-34th-bunch/bunch_server@${{ steps.publish.outputs.digest }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y sshpass
          printf '%s' "$GITHUB_TOKEN" |
            sshpass -d 3 ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
              -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
                set -eu
                export DOCKER_CONFIG=\$(mktemp -d)
                trap 'rm -r -- \"\$DOCKER_CONFIG\"' EXIT
                docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin
                docker pull '$APP_IMAGE'
              " 3<<< "$SSH_PASSWORD"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
