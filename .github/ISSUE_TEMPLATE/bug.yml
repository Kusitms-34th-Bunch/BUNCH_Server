name: 버그 보고
description: 문제와 재현 방법을 기록합니다.
title: "fix: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 🐛 문제
      description: 발생한 문제와 영향을 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: 📄 관련 Spec
      placeholder: docs/specs/...
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: Spec상 정상 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      value: |-
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 발생 환경
      value: |-
        - 실행 환경:
        - 관련 버전 또는 커밋:
        - 로그 또는 오류 응답:
      description: 토큰 및 비밀값을 제거한 로그만 첨부해주세요.
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      value: |-
        - [ ] 문제 수정
        - [ ] 기존 기능 영향 확인
        - [ ] 회귀 테스트 추가 또는 미추가 이유 기록
        - [ ] 문서 업데이트(필요 시)
