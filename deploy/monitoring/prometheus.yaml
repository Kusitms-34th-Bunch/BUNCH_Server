# Separate scrape targets retain environment labels even when a target is down.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: bunch
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["dev-app:8081"]
        labels:
          service: bunch
          environment: dev
      - targets: ["prod-app:8081"]
        labels:
          service: bunch
          environment: prod
