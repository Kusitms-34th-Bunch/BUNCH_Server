# Share the existing project and network so the current Tunnel still resolves grafana.
name: bunch

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    logging: *logging
    user: "0"
    environment:
      MONITORING_ENVIRONMENT: prod
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    logging: *logging
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - lokidata:/loki

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheusdata:/prometheus

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    logging: *logging
    environment:
      MONITORING_ENVIRONMENT: prod
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set initial Grafana admin password}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:?Set Grafana HTTPS root URL}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_UNIFIED_ALERTING_MIN_INTERVAL: 10s
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:?Set the monitoring Discord webhook}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana

volumes:
  alloydata:
    external: true
    name: bunch_alloydata
  lokidata:
    external: true
    name: bunch_lokidata
  prometheusdata:
    external: true
    name: bunch_prometheusdata
  grafanadata:
    external: true
    name: bunch_grafanadata

networks:
  default:
    external: true
    name: bunch_default
